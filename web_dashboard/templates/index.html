<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Dashboard</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../static/vendors/mdi/css/materialdesignicons.min.css">
  <link rel="stylesheet" href="../static/vendors/flag-icon-css/css/flag-icon.min.css">
  <link rel="stylesheet" href="../static/vendors/css/vendor.bundle.base.css">
  <link rel="stylesheet" href="../static/vendors/jquery-bar-rating/css-stars.css" />
  <link rel="stylesheet" href="../static/vendors/font-awesome/css/font-awesome.min.css" />
  <!-- <link rel="stylesheet" href="../static/css/demo_1/style.css" /> -->
  <link rel="shortcut icon" href="../static/images/favicon.png" />
  <!-- CSS for the sidebar and banners -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">

  <!-- Firebase and Moment.js -->
  <script src="https://www.gstatic.com/firebasejs/6.0.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/6.0.0/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/6.0.0/firebase-auth.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>

  <!-- Custom JS -->
  <script src="../static/js/dashboard-functions.js"></script>






</head>

<body>


  <div id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <img src="../static/images/icon-watch.png" alt="Logo" class="sidebar-logo" id="sidebar-logo">
      <button id="toggleSidebar" class="hamburger">&#9776;</button>
    </div>
    <ul class="sidebar-menu">
      <li id="home" class="sidebar-item"><i class="fa fa-home"></i><span class="sidebar-text">Home</span></li>
      <li id="analytics" class="sidebar-item"><i class="fa fa-line-chart"></i><span
          class="sidebar-text">Analytics</span></li>
          <a href = "{{ url_for('settings')}}" style="text-decoration: none;"><li id="settings" class="sidebar-item"><i class="fa fa-cog"></i><span class="sidebar-text">Settings</span></li></a>
      <li id="logout" class="sidebar-item"><i class="fa fa-sign-out"></i><span class="sidebar-text">Logout</span></li>
    </ul>
  </div>

  <div class="content">


  <div class="top-banner">
    <div class="logo-section">
      <!-- <img src="../static/images/apple-watch.png" alt="Logo" class="top-banner-logo" /> -->
      <span class="logo-text">Hello, XXXXX!</span>
    </div>
    <div class="profile-section">
      <span class="username" id="userName">{{ user_email }}</span>
      <img src="../static/images/user.png" alt="Profile Icon" class="profile-icon" width="30" height="30" />
    </div>
  </div>


  


    <iframe src="/dash/" width="100%" height="3000px"></iframe> <!--width="100%" height="1500px" style="border:none;"-->

    <div class="metric-container">
      <div class="metric-box">
        <div class="metric-header">
          <span class="metric-title">Lowest Resting HR</span>
          <img src="../static/images/heart.png" alt="Logo" class="metric-logo">
        </div>
        <div class="metric-value">67 bpm</div>
      </div>
      <div class="metric-box">
        <div class="metric-header">
          <span class="metric-title">Average HRV</span>
          <img src="../static/images/electrocardiogram.png" alt="Logo" class="metric-logo">
        </div>
        <div class="metric-value">45 ms</div>
      </div>
      <div class="metric-box">
        <div class="metric-header">
          <span class="metric-title">Total Steps</span>
          <img src="../static/images/man-walking.png" alt="Logo" class="metric-logo">
        </div>
        <div class="metric-value">9101</div>
      </div>
      <div class="metric-box">
        <div class="metric-header">
          <span class="metric-title">Activity Burn</span>
          <img src="../static/images/barbell.png" alt="Logo" class="metric-logo">
        </div>
        <div class="metric-value">1380</div>
      </div>



    </div>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const currentPage = window.location.pathname;
      const sidebarItems = document.querySelectorAll(".sidebar-item");

      sidebarItems.forEach(item => {
        if (currentPage.includes(item.id)) {
          item.classList.add("active");
        }
        item.addEventListener("click", function () {
          sidebarItems.forEach(i => i.classList.remove("active")); // Remove highlight from others
          item.classList.add("active"); // Highlight clicked item
        });
      });
    });

    // Sidebar toggle functionality
    document.getElementById("toggleSidebar").addEventListener("click", function () {
      var sidebar = document.getElementById("sidebar");
      var logo = document.getElementById("sidebar-logo");
      if (sidebar.classList.contains("expanded")) {
        sidebar.classList.remove("expanded");
        logo.style.display = "none";
      } else {
        sidebar.classList.add("expanded");
        logo.style.display = "block";
      }
    });
  </script>






</body>

</html>
